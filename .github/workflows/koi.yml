name: Git-Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency:
  group: profile-koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Commit the GIF only when it changes
        shell: bash
        run: |
          git add -- koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: refresh Git-Koi"

          # Another profile workflow can update main at the same time.
          # Rebase and retry so this commit contains only the GIF on top of
          # the latest profile assets.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another profile update (attempt ${attempt}/3); retrying."
          done
          exit 1
